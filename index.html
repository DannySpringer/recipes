<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Recipes we cook at home, laid out for a phone on the counter.">
<title>Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: same family as the recipe pages; one column of big tap cards, each tinted with its recipe's accent */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --fg: #22201c;
  --muted: #645f57;
  --line: #e2ded4;
  --accent: #8a5a1c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --surface: #1f1d1a; --fg: #ece9e3; --muted: #a9a49b; --line: #34312c; --accent: #e0a85a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --surface: #1f1d1a; --fg: #ece9e3; --muted: #a9a49b; --line: #34312c; --accent: #e0a85a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1.125rem; line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) 16px calc(48px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
header { padding-top: 28px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2.25rem; line-height: 1.05; margin: 0; letter-spacing: -0.015em; }
.lede { margin: .35rem 0 0; color: var(--muted); }

.search {
  font: inherit; width: 100%; min-height: 48px; padding: 10px 16px;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card {
  --c: var(--accent);
  display: flex; flex-direction: column; gap: 4px;
  padding: 16px 18px 16px 22px; min-height: 64px; position: relative;
  background: var(--surface); color: var(--fg); text-decoration: none;
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { --c: var(--c-dark, var(--accent)); } }
:root[data-theme="dark"] .card { --c: var(--c-dark, var(--accent)); }
.card:active { transform: scale(.99); }
.card:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.name { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.15; text-wrap: balance; }
.blurb { color: var(--muted); font-size: 1rem; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.facts span { font-size: .9rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: 1rem 0; }
@media (prefers-reduced-motion: reduce) { .card:active { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Recipes</h1>
    <p class="lede">Tap one to cook it. Every page has a checklist and timers.</p>
  </header>

  <input class="search" id="q" type="search" placeholder="Find a recipe" aria-label="Find a recipe" autocomplete="off">

  <!-- One <li> per recipe, sorted A to Z by name. See CLAUDE.md. -->
  <ul class="list" id="list">
    <li><a class="card" href="recipes/black-beans-and-greens.html" style="--c:#557a14; --c-dark:#a9d454">
      <span class="name">Black Beans &amp; Greens</span>
      <span class="blurb">Slow-cooker beans with greens, coconut milk and lime. No soaking.</span>
      <span class="facts"><span>~4 hr</span><span>Serves 6</span></span>
    </a></li>
    <li><a class="card" href="recipes/tzatziki.html" style="--c:#2f7d4f; --c-dark:#6cc890">
      <span class="name">Tzatziki</span>
      <span class="blurb">Cucumber yogurt dip with garlic, lemon and dill.</span>
      <span class="facts"><span>5 min</span><span>One bowl</span></span>
    </a></li>
  </ul>
  <p class="empty" id="empty" hidden>No recipe matches that.</p>
</main>

<script>
(function () {
  var q = document.getElementById("q"), empty = document.getElementById("empty");
  var items = [].slice.call(document.querySelectorAll("#list > li"));
  q.addEventListener("input", function () {
    var term = q.value.trim().toLowerCase(), shown = 0;
    items.forEach(function (li) {
      var hit = !term || li.textContent.toLowerCase().indexOf(term) !== -1;
      li.hidden = !hit; if (hit) shown++;
    });
    empty.hidden = shown !== 0;
  });
})();
</script>
</body>
</html>
